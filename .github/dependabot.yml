version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(dev-deps)"
    groups:
      # Chat SDK packages must move together (peer + runtime dependency).
      chat-sdk:
        patterns: ["chat", "@chat-adapter/*"]
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
        exclude-patterns: ["chat", "@chat-adapter/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
