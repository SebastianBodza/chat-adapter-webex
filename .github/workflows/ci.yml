name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly run so a new `chat` release is caught even without new commits.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests
        run: npm run test:integration
      - name: Coverage (enforces thresholds)
        if: matrix.node == 24
        run: npm test
      - name: Coverage summary
        if: matrix.node == 24 && always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
              console.log(["### Coverage", "| Metric | % | Covered |", "|---|---|---|",
                ...["lines", "statements", "functions", "branches"].map(row)].join("\n"));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: matrix.node == 24 && always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: Build & package check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Lint package.json exports (publint)
        run: npm run check:package
      - name: Smoke test the packed tarball as a consumer
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
          npm init -y >/dev/null
          npm pkg set type=module
          # Pin `chat` to the lockfile version so the smoke test is deterministic;
          # newer releases are covered by the compat job.
          CHAT_VERSION=$(node -p 'require("${{ github.workspace }}/package-lock.json").packages["node_modules/chat"].version')
          npm install --no-audit --no-fund "$RUNNER_TEMP"/bitbasti-chat-adapter-webex-*.tgz "chat@$CHAT_VERSION"
          node --input-type=module -e '
            const m = await import("@bitbasti/chat-adapter-webex");
            for (const name of ["createWebexAdapter", "WebexAdapter", "WebexFormatConverter", "cardToWebexAdaptiveCard"]) {
              if (typeof m[name] !== "function") throw new Error(`missing export: ${name}`);
            }
            const adapter = m.createWebexAdapter({ botToken: "t", logger: { debug(){}, info(){}, warn(){}, error(){}, child() { return this; } } });
            if (adapter.name !== "webex") throw new Error("unexpected adapter name");
            console.log("packed package imports cleanly");
          '

  compat:
    name: Compat (chat ${{ matrix.chat }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # minimum = lower bound of the peerDependencies range, latest = newest on npm.
        chat: [minimum, latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install chat SDK (${{ matrix.chat }})
        run: |
          if [ "${{ matrix.chat }}" = "minimum" ]; then
            VERSION=$(node -p 'require("./package.json").peerDependencies.chat.replace(/^[^0-9]*/, "")')
          else
            VERSION=$(npm view chat version)
          fi
          echo "Testing against chat@$VERSION"
          echo "### chat@$VERSION" >> "$GITHUB_STEP_SUMMARY"
          npm install --no-save --no-audit --no-fund --legacy-peer-deps \
            "chat@$VERSION" "@chat-adapter/shared@$VERSION" "@chat-adapter/state-memory@$VERSION"
      - run: npm run typecheck
      - run: npx vitest run

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify registry signatures
        run: npm audit signatures
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
